{% extends "base.html" %}
{% block title %}Choose a new password — Colombo Land Price Estimator{% endblock %}

{% block content %}
<section class="surface-card mx-auto max-w-sm p-7">
  <h1 class="mb-5 text-xl font-bold text-ink">Choose a new password</h1>
  <form class="flex flex-col gap-1" method="post" action="{{ url_for('auth.reset_password', token=token) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field-label mt-2.5" for="password">New password</label>
    <input class="field-input" type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
    <button class="btn btn-primary mt-4" type="submit">Update password</button>
  </form>
</section>
{% endblock %}
