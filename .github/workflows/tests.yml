name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Model tests
        run: pytest test_predictor.py -v

      - name: App starts
        run: python -c "from app import create_app; app = create_app(); print(len(list(app.url_map.iter_rules())), 'routes')"
